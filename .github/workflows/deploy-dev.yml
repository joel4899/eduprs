name: Deploy to Hetzner Dev

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      # -----------------------------------------------------------------------
      # 1. Source
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. PHP dependencies
      # -----------------------------------------------------------------------
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # -----------------------------------------------------------------------
      # 3. Frontend assets
      # -----------------------------------------------------------------------
      - name: Build frontend assets
        run: npm install && npm run build

      # -----------------------------------------------------------------------
      # 4. Sync built files to app directory (local — no SSH needed)
      #    .env is excluded so the server's copy is never overwritten
      # -----------------------------------------------------------------------
      - name: Sync to app directory
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            ./ $HOME/eduprs/

      # -----------------------------------------------------------------------
      # 5. Post-deploy artisan commands
      # -----------------------------------------------------------------------
      - name: Run artisan commands
        run: |
          cd $HOME/eduprs
          mkdir -p storage/framework/{cache,sessions,views,testing}
          php artisan migrate --force --no-interaction
          php artisan storage:link --force
          chmod -R 775 storage bootstrap/cache
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
