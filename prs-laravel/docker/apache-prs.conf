# Apache vhost for the PRS Laravel app.
# - Listens on $PORT (Render injects this; defaults to 10000)
# - DocumentRoot is /var/www/html/public (Laravel front controller)
# - AllowOverride All so public/.htaccess rewrites are honoured

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Forward real client IP through the Render proxy
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
